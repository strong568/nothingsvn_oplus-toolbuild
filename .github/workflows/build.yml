name: Re-NothingsVN Oplus ROM Build

on:
  workflow_dispatch:
    inputs:
      input_url:
        description: 'URL of the ROM to build'
        required: true
      builder_name:
        description: 'Tên người build'
        required: false
      builder_id:
        description: 'ID người build'
        required: false

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:

      - name: Clean All Unused file,application
        run: |
          docker rmi `docker images -q` || true
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /etc/sudo apt/sources.list.d || true
          sudo apt -y purge azure-cli ghc* zulu* hhvm llvm* firefox google* dotnet* powershell mysql* php* || true
          sudo apt -y autoremove --purge || true
          sudo apt -y autoclean || true
          sudo apt clean || true

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          swap-size-mb: 1024
          root-reserve-mb: 512
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Checkout repository
        uses: actions/checkout@main

      - name: Set up Time
        run: |
          echo "Setting Vienam timezone"
          sudo timedatectl set-timezone Asia/Ho_Chi_Minh

      - name: Install OpenJDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Stuff
        run: |
          sudo bash setup.sh

      - name: Giving permission
        run: |
          sudo chmod 777 -R *

      - name: Build ROM...
        env:
          INPUT_URL: ${{ inputs.input_url }}
        run: |
          sudo -E bash build.sh "$INPUT_URL" "n" "${{ github.repository }}" "oplus" "${{ inputs.builder_name }}" "${{ inputs.builder_id }}"

      - name: Pack ROM...
        run: |
          sudo bash packROM.sh n

      - name: Prepare artifact name
        id: artifact
        run: |
          ANDROID_VER=$(cat bin/ddevice/androidver.txt 2>/dev/null || echo "unknown")
          DEVICE_MODEL=$(cat bin/ddevice/device_model.txt 2>/dev/null || echo "unknown")
          BASE_BUILD_ID=$(cat bin/ddevice/base_build_id.txt 2>/dev/null || echo "unknown")
          BRAND=$(cat bin/ddevice/brand.txt 2>/dev/null || echo "")
          if [[ "$BRAND" == "OnePlus" ]]; then NTBUILD="ColorOS"; elif [[ "$BRAND" == "OnePlus_Global" ]]; then NTBUILD="OxygenOS"; else NTBUILD="ROM"; fi
          echo "name=${NTBUILD}_${DEVICE_MODEL}_${ANDROID_VER}_OS${BASE_BUILD_ID}" >> $GITHUB_OUTPUT

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: out/*.zip
          retention-days: 90
